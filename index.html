<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel Auto Deployer</title>
  <!-- Menggunakan font modern 'Inter' -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🚀 Vercel Deployer</h2>
      <p>Deploy file HTML Anda dalam hitungan detik</p>
    </div>
    
    <div class="form-group">
      <label for="projectName">Nama Project</label>
      <input type="text" id="projectName" placeholder="contoh: web-portofolio-saya" required>
    </div>

    <div class="form-group">
      <label for="htmlFile">File HTML</label>
      <div class="file-input-wrapper">
        <input type="file" id="htmlFile" accept=".html" required>
      </div>
    </div>

    <button id="btnDeploy">Deploy ke Vercel</button>

    <div id="status"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
